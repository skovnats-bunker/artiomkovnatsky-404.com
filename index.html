<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    svg { width: 100vw; height: 100vh; }

    .zone {
      cursor: pointer;
      fill: rgba(255, 255, 255, 0.08);
      stroke: rgba(255, 255, 255, 0.25);
      stroke-width: 1.5;
      pointer-events: all;
      transition: fill 0.3s, stroke 0.3s;
    }
    .zone:hover {
      fill: rgba(255, 255, 255, 0.20);
      stroke: rgba(255, 255, 255, 0.60);
    }

    .tip {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      fill: rgba(255, 255, 255, 0.85);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .hotspot:hover .tip { opacity: 1; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1456 816" preserveAspectRatio="xMidYMid slice">

    <image href="404vsMuffin-7.png"
           width="1456" height="816"
           preserveAspectRatio="xMidYMid slice"/>

    <!-- ⚓ Фуражка -->
    <a href="https://www.artiomkovnatsky.com/" target="_blank">
      <g class="hotspot">
        <ellipse class="zone" cx="905" cy="85" rx="88" ry="44"/>
        <text class="tip" x="905" y="148" text-anchor="middle">#DrArtiomKovnatsky</text>
      </g>
    </a>

    <!-- 😉 Левый глаз -->
    <a href="https://codeberg.org/skovnats/SVE-Systemic-Verification-Engineering/src/branch/master/Community/%D0%9C%D0%B5%D0%B4%D0%BE%D0%B5%D0%B4%D0%93%D1%83%D1%81%D0%B0%D1%80%D0%9F%D0%BB%D1%8E%D1%81%D0%B8%D0%BA" target="_blank">
      <g class="hotspot">
        <ellipse class="zone" cx="808" cy="350" rx="44" ry="19"/>
        <text class="tip" x="808" y="388" text-anchor="middle">#Gusarstv0 aka #HoneyBadger</text>
      </g>
    </a>

    <!-- 👁️ Правый глаз -->
    <a href="https://codeberg.org/skovnats/SVE-Systemic-Verification-Engineering/src/branch/master/Memtrioshka">
      <g class="hotspot">
        <ellipse class="zone" cx="927" cy="350" rx="44" ry="19"/>
        <text class="tip" x="927" y="388" text-anchor="middle">#Memtrioshka+</text>
      </g>
    </a>

    <!-- 👄 Рот -->
    <a href="https://x.com/ArtiomKovnatsky" target="_blank">
      <g class="hotspot">
        <ellipse class="zone" cx="844" cy="510" rx="90" ry="33"/>
        <text class="tip" x="844" y="560" text-anchor="middle">@ArtiomKovnatsky</text>
      </g>
    </a>

  </svg>
</body>
</html>
